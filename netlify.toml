# Static site files live in website/. base + publish avoids a wrong publish path when
# the dashboard "Base directory" was set to website/ (publish = "website/" doubled the folder).
[build]
  base = "website"
  publish = "."

# Redirect trailing slashes
[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

# French thank-you page
[[redirects]]
  from = "/merci"
  to = "/merci.html"
  status = 200

# English thank-you page
[[redirects]]
  from = "/en/thank-you"
  to = "/en/thank-you.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'"

# Cache static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
